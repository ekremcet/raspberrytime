<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mesaj Kutusu – Yönetim</title>
<style>
:root {
  --bg: #F3F5F9; --card: #FFFFFF; --ink: #1B2230; --muted: #5C667A; --line: #DDE2EA;
  --accent: #2F6FED; --accent-ink: #fff; --soft: #E6EEFE; --warn-bg: #FFF3DD; --warn: #6B4100; --danger: #C42B31;
  font-family: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #10141B; --card: #171C25; --ink: #E7EBF2; --muted: #9DA8BA; --line: #2A3242; --accent: #6F9CFF; --accent-ink: #0B1220; --soft: #1C2A47; --warn-bg: #2C2213; --warn: #F6CF8A; --danger: #FF6B70; color-scheme: dark; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font-size: 15px; line-height: 1.5; }
[hidden] { display: none !important; }
main { max-width: 760px; margin: 0 auto; padding: 24px max(16px, env(safe-area-inset-left)) 48px; display: flex; flex-direction: column; gap: 20px; }
h1 { font-size: 24px; margin: 0; }
h2 { font-size: 15px; margin: 0 0 10px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; }
.kart { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; }
button, input, select { font: inherit; color: inherit; }
button { min-height: 44px; padding: 0 16px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); cursor: pointer; font-weight: 600; }
button.ana { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
button.tehlike { color: var(--danger); }
button:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
input[type=text], input[type=password] { min-height: 44px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); width: 100%; }
.satir { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.bilgi { display: flex; flex-direction: column; gap: 8px; }
.baglanti { font-family: ui-monospace, Menlo, monospace; font-size: 14px; background: var(--soft); padding: 8px 10px; border-radius: 8px; word-break: break-all; user-select: all; }
.not { background: var(--warn-bg); color: var(--warn); border-radius: 10px; padding: 10px 12px; font-size: 14px; }
.kisi { display: grid; grid-template-columns: 84px minmax(0, 1fr); gap: 14px; padding: 14px 0; border-top: 1px solid var(--line); }
.kisi:first-of-type { border-top: none; }
.foto { width: 84px; height: 84px; border-radius: 20px; overflow: hidden; display: flex; align-items: flex-end; justify-content: center; position: relative; border: none; padding: 0; }
.foto img { width: 100%; height: 100%; object-fit: contain; }
.foto svg { width: 80%; height: 80%; }
.foto span { position: absolute; inset: auto 0 0 0; background: rgba(0, 0, 0, .55); color: #fff; font-size: 11px; padding: 3px 0; }
.alanlar { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.renkler { display: flex; gap: 6px; flex-wrap: wrap; }
.renkler button { width: 32px; min-height: 32px; height: 32px; padding: 0; border-radius: 50%; border: 3px solid transparent; }
.renkler button.secili { border-color: var(--ink); }
.kucuk { font-size: 13px; color: var(--muted); }
.bos { color: var(--muted); }
.durum { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; }
.nokta { width: 8px; height: 8px; border-radius: 50%; background: #2E9E5B; }
.nokta.yok { background: var(--danger); }
.kayit-durum { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); z-index: 10; display: inline-flex; align-items: center; gap: 8px; padding: 10px 18px; border-radius: 999px; font-weight: 700; font-size: 14px; background: var(--ink); color: var(--bg); box-shadow: 0 8px 24px rgba(0,0,0,.25); }
.kayit-durum.tamam { background: #2E9E5B; color: #fff; }
.kayit-durum.hata { background: var(--danger); color: #fff; }
.ad-durum { font-size: 13px; font-weight: 600; min-width: 92px; }
.ad-durum.bekliyor { color: var(--muted); } .ad-durum.tamam { color: #2E9E5B; } .ad-durum.hata { color: var(--danger); }
.foto.yukleniyor::after { content: "Yükleniyor…"; position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,.6); color: #fff; font-size: 12px; font-weight: 700; }
</style>
</head>
<body>
<main>
  <div><div class="kucuk">Yönetim</div><h1 id="baslik">Mesaj Kutusu</h1></div>

  <section class="kart" id="giris">
    <h2>Giriş</h2>
    <form class="satir" id="pinForm">
      <label for="pin" class="kucuk" style="width:100%">Yönetici PIN'i (cihazın ayarlar.env dosyasında ya da açılış kaydında yazar)</label>
      <input type="password" id="pin" inputmode="numeric" autocomplete="current-password" style="flex:1;min-width:160px">
      <button class="ana" type="submit">Giriş yap</button>
    </form>
    <p class="not" id="pinHata" hidden>PIN hatalı.</p>
  </section>

  <div id="icerik" hidden style="display:flex;flex-direction:column;gap:20px">
    <section class="kart bilgi" id="bilgiKart">
      <h2>Bot</h2>
      <div class="durum"><i class="nokta" id="nokta"></i><span id="durumYazi"></span></div>
      <div id="botAlan"></div>
    </section>

    <section class="kart" id="bekleyenKart" hidden>
      <h2>Onay bekleyenler</h2>
      <div id="bekleyenler"></div>
    </section>

    <section class="kart">
      <h2>Kutudaki kişiler</h2>
      <p class="kucuk" style="margin:0 0 6px">Değişiklikler otomatik kaydedilir ve kutunun ekranına hemen yansır. Her kayıttan sonra altta yeşil <b>Kaydedildi</b> yazısı çıkar.</p>
      <div id="kisiler"></div>
    </section>

    <section class="kart" id="engelliKart" hidden>
      <h2>Engellenenler</h2>
      <div id="engelliler"></div>
    </section>
  </div>
</main>
<input type="file" id="dosya" accept="image/*" hidden>
<div class="kayit-durum" id="kayitDurum" role="status" aria-live="polite" hidden></div>

<script>
(function () {
"use strict";
const $ = id => document.getElementById(id);
const RENKLER = ["#F28B50", "#4D8DF7", "#9B6BE0", "#2FA98C", "#E0588E", "#E3A21A", "#5B7CFA", "#D1495B"];
const SILUET = '<svg viewBox="0 0 100 87" aria-hidden="true"><circle cx="50" cy="34" r="22" fill="#fff" fill-opacity=".92"/><path d="M8 87c2-24 19-36 42-36s40 12 42 36z" fill="#fff" fill-opacity=".92"/></svg>';
let PIN = ""; try { PIN = sessionStorage.getItem("kutu-pin") || ""; } catch (e) {}
let KISILER = [], fotoHedef = null;
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

async function api(yol, secenek = {}) {
  secenek.headers = Object.assign({ "X-Yonetici-Pin": PIN }, secenek.headers || {});
  const r = await fetch(yol, secenek);
  if (r.status === 401) { cikis(); throw new Error("PIN"); }
  if (!r.ok) throw new Error(await r.text());
  return r.headers.get("content-type")?.includes("json") ? r.json() : r.text();
}
function cikis() { PIN = ""; try { sessionStorage.removeItem("kutu-pin"); } catch (e) {} $("icerik").hidden = true; $("giris").hidden = false; }
$("pinForm").addEventListener("submit", async e => {
  e.preventDefault(); PIN = $("pin").value.trim();
  try { await yukle(); try { sessionStorage.setItem("kutu-pin", PIN); } catch (e2) {} $("pinHata").hidden = true; }
  catch (err) { $("pinHata").hidden = false; }
});

async function yukle() {
  const [b, ks] = await Promise.all([api("/api/yonetim/bilgi"), api("/api/yonetim/kisiler")]);
  $("giris").hidden = true; $("icerik").hidden = false; $("baslik").textContent = b.kutu_adi;
  $("nokta").classList.toggle("yok", !b.cevrimici);
  $("durumYazi").textContent = b.demo ? "Demo modu: Telegram'a bağlı değil (ayarlar.env içinde BOT_TOKEN yok)" : b.cevrimici ? "Telegram'a bağlı" : (b.neden === "anahtar" ? "Bot anahtarı hatalı: ayarlar.env içindeki BOT_TOKEN'ı kontrol et" : "Telegram'a bağlanılamıyor (internet)");
  $("botAlan").innerHTML = b.baglanti
    ? `<p style="margin:0">Aile üyeleri bu bağlantıyı açıp <b>Başlat</b>'a dokunsun. Sonra burada onayla.</p>
       <div class="satir"><span class="baglanti" id="link">${esc(b.baglanti)}</span><button id="kopyala" type="button">Kopyala</button></div>`
    : (b.demo ? `<p class="not">Demo modunda örnek kişilerle çalışıyor. Her kişinin altındaki <b>Deneme mesajı</b> ile ekrana gelen mesajı deneyebilirsin.</p>` : "");
  if (!b.ffmpeg) $("botAlan").insertAdjacentHTML("beforeend", `<p class="not">ffmpeg bulunamadı. Sesler dönüştürülemez: <code>sudo apt install ffmpeg</code></p>`);
  const k = $("kopyala"); if (k) k.onclick = async () => { try { await navigator.clipboard.writeText(b.baglanti); k.textContent = "Kopyalandı"; } catch (e) { getSelection().selectAllChildren($("link")); } };
  KISILER = ks; ciz();
}

function fotoHTML(k) { return k.foto ? `<img src="/medya/${esc(k.foto)}" alt="">` : SILUET; }
function ciz() {
  const onayli = KISILER.filter(k => k.durum === 1), bekl = KISILER.filter(k => k.durum === 0), eng = KISILER.filter(k => k.durum === -1);
  $("bekleyenKart").hidden = !bekl.length;
  $("bekleyenler").innerHTML = bekl.map(k => `<div class="kisi" data-id="${k.id}">
      <div class="foto" style="background:${esc(k.renk)}">${SILUET}</div>
      <div class="alanlar"><div><b>${esc(k.tg_ad)}</b> ${k.tg_kullanici ? `<span class="kucuk">@${esc(k.tg_kullanici)}</span>` : ""}</div>
        <label class="kucuk" for="ad${k.id}">Kutuda görünecek ad</label><input type="text" id="ad${k.id}" value="${esc(k.ad)}" maxlength="30">
        <div class="satir"><button class="ana" data-is="onayla">Onayla</button><button class="tehlike" data-is="engelle">Engelle</button></div></div></div>`).join("");
  $("kisiler").innerHTML = onayli.length ? onayli.map((k, i) => `<div class="kisi" data-id="${k.id}">
      <button class="foto" style="background:${esc(k.renk)}" data-is="foto" aria-label="${esc(k.ad)} fotoğrafını değiştir">${fotoHTML(k)}<span>Fotoğraf</span></button>
      <div class="alanlar">
        <div class="satir"><input type="text" value="${esc(k.ad)}" maxlength="30" aria-label="Kutuda görünecek ad" data-is="ad" data-eski="${esc(k.ad)}" style="flex:1;min-width:140px" enterkeyhint="done">
          <span class="ad-durum" id="adDurum${k.id}"></span></div>
        ${k.tg_ad && k.tg_ad !== k.ad ? `<div class="kucuk">Telegram'daki adı: ${esc(k.tg_ad)}</div>` : ""}
        <div class="renkler">${RENKLER.map(r => `<button style="background:${r}" data-is="renk" data-renk="${r}" class="${r === k.renk ? "secili" : ""}" aria-label="Renk ${r}"></button>`).join("")}</div>
        <div class="satir"><button data-is="yukari" ${i === 0 ? "disabled" : ""} aria-label="Yukarı taşı">↑</button><button data-is="asagi" ${i === onayli.length - 1 ? "disabled" : ""} aria-label="Aşağı taşı">↓</button>
          <button data-is="deneme">Deneme mesajı</button><button class="tehlike" data-is="sil">Kaldır</button></div>
      </div></div>`).join("") : `<p class="bos">Henüz onaylı kişi yok.</p>`;
  $("engelliKart").hidden = !eng.length;
  $("engelliler").innerHTML = eng.map(k => `<div class="satir kisi" data-id="${k.id}" style="display:flex"><span style="flex:1">${esc(k.tg_ad)}</span><button data-is="ac">Engeli kaldır</button><button class="tehlike" data-is="sil">Sil</button></div>`).join("");
}

let durumT = null;
function kayitDurum(tur, yazi) {
  const d = $("kayitDurum"); clearTimeout(durumT);
  d.className = "kayit-durum " + tur; d.textContent = yazi; d.hidden = false;
  if (tur !== "bekliyor") durumT = setTimeout(() => d.hidden = true, tur === "hata" ? 5000 : 2200);
}
// Her yazma işlemi: "Kaydediliyor…" → "✓ Kaydedildi" ya da "Kaydedilemedi"
async function kaydet(is, tamamYazi = "✓ Kaydedildi") {
  kayitDurum("bekliyor", "Kaydediliyor…");
  try { const r = await is(); kayitDurum("tamam", tamamYazi); return r; }
  catch (err) { if (err.message !== "PIN") kayitDurum("hata", "Kaydedilemedi: " + (err.message || "bağlantı yok").slice(0, 80)); throw err; }
}
async function guncelle(id, veri, yazi) { await kaydet(async () => { await api("/api/yonetim/kisi/" + id, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(veri) }); await yukle(); }, yazi); }
document.addEventListener("click", async e => {
  const b = e.target.closest("[data-is]"); if (!b) return; const satir = b.closest("[data-id]"); if (!satir) return;
  const id = +satir.dataset.id, is = b.dataset.is;
  try {
    if (is === "onayla") await guncelle(id, { durum: 1, ad: $("ad" + id).value }, "✓ Onaylandı, kutuda görünüyor");
    else if (is === "engelle") await guncelle(id, { durum: -1 }, "✓ Engellendi");
    else if (is === "ac") await guncelle(id, { durum: 0 }, "✓ Engel kaldırıldı");
    else if (is === "renk") await guncelle(id, { renk: b.dataset.renk }, "✓ Renk kaydedildi");
    else if (is === "foto") { fotoHedef = id; $("dosya").value = ""; $("dosya").click(); }
    else if (is === "deneme") { b.disabled = true; try { await kaydet(() => api("/api/yonetim/deneme/" + id, { method: "POST" }), "✓ Deneme mesajı kutuya gönderildi"); } finally { setTimeout(() => { b.disabled = false; }, 2000); } }
    else if (is === "sil") { if (b.dataset.onay !== "1") { b.dataset.onay = "1"; b.textContent = "Emin misin? Tekrar dokun"; setTimeout(() => { b.dataset.onay = ""; b.textContent = is === "sil" && satir.closest("#engelliler") ? "Sil" : "Kaldır"; }, 3000); return; }
      await kaydet(async () => { await api("/api/yonetim/kisi/" + id, { method: "DELETE" }); await yukle(); }, "✓ Kaldırıldı"); }
    else if (is === "yukari" || is === "asagi") {
      const ids = KISILER.filter(k => k.durum === 1).map(k => k.id); const i = ids.indexOf(id), j = is === "yukari" ? i - 1 : i + 1;
      [ids[i], ids[j]] = [ids[j], ids[i]];
      await kaydet(async () => { await api("/api/yonetim/sira", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ idler: ids }) }); await yukle(); }, "✓ Sıra kaydedildi");
    }
  } catch (err) { /* kayitDurum hatayı gösterdi */ }
});
// Ad: yazmayı bırakınca (1 sn), Enter'a basınca ya da alandan çıkınca kaydedilir
const adZaman = {};
async function adKaydet(inp) {
  const id = +inp.closest("[data-id]").dataset.id, yeni = inp.value.trim(), dur = $("adDurum" + id);
  clearTimeout(adZaman[id]); adZaman[id] = null;
  if (!yeni || yeni === inp.dataset.eski) { if (dur && !yeni) { dur.className = "ad-durum hata"; dur.textContent = "Ad boş olamaz"; } return; }
  if (dur) { dur.className = "ad-durum bekliyor"; dur.textContent = "Kaydediliyor…"; }
  try {
    await kaydet(() => api("/api/yonetim/kisi/" + id, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ ad: yeni }) }), "✓ Ad kaydedildi");
    inp.dataset.eski = yeni; const k = KISILER.find(x => x.id === id); if (k) k.ad = yeni;
    if (dur) { dur.className = "ad-durum tamam"; dur.textContent = "✓ Kaydedildi"; setTimeout(() => { if (dur.textContent === "✓ Kaydedildi") dur.textContent = ""; }, 3000); }
  } catch (err) { if (dur) { dur.className = "ad-durum hata"; dur.textContent = "Kaydedilemedi"; } }
}
document.addEventListener("input", e => {
  const inp = e.target; if (inp.dataset.is !== "ad") return; const id = +inp.closest("[data-id]").dataset.id, dur = $("adDurum" + id);
  if (dur) { dur.className = "ad-durum bekliyor"; dur.textContent = inp.value.trim() === inp.dataset.eski ? "" : "Kaydedilmedi…"; }
  clearTimeout(adZaman[id]); adZaman[id] = setTimeout(() => adKaydet(inp), 1000);
});
document.addEventListener("change", e => { if (e.target.dataset.is === "ad") adKaydet(e.target); });
document.addEventListener("keydown", e => { if (e.key === "Enter" && e.target.dataset.is === "ad") { e.preventDefault(); e.target.blur(); } });
function alertKutu(m) { const p = document.createElement("p"); p.className = "not"; p.textContent = "Olmadı: " + m; document.querySelector("main").prepend(p); setTimeout(() => p.remove(), 5000); }

$("dosya").addEventListener("change", async () => {
  const f = $("dosya").files[0]; if (!f || fotoHedef == null) return;
  const img = new Image(); img.src = URL.createObjectURL(f); await img.decode();
  const M = 1024, o = Math.min(1, M / Math.max(img.naturalWidth, img.naturalHeight));   // kırpma yok, oran korunur
  const c = document.createElement("canvas"); c.width = Math.round(img.naturalWidth * o); c.height = Math.round(img.naturalHeight * o);
  c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
  const blob = await new Promise(r => c.toBlob(r, "image/jpeg", 0.86));
  const kutu = document.querySelector(`[data-id="${fotoHedef}"] .foto`); if (kutu) kutu.classList.add("yukleniyor");
  try { await kaydet(async () => { await api("/api/yonetim/foto/" + fotoHedef, { method: "POST", headers: { "Content-Type": "image/jpeg" }, body: blob }); await yukle(); }, "✓ Fotoğraf kaydedildi"); }
  catch (err) { if (kutu) kutu.classList.remove("yukleniyor"); }
});

if (PIN) yukle().catch(() => {});
setInterval(() => { if (PIN && !$("icerik").hidden && !document.activeElement?.matches("input") && !Object.values(adZaman).some(Boolean)) yukle().catch(() => {}); }, 15000);
})();
</script>
</body>
</html>
