<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Mesaj Kutusu</title>
<style>
:root {
  --bg: #F3F6FB; --card: #FFFFFF; --ink: #1D2433; --muted: #5B6577;
  --accent: #2F6FED; --rec: #D93036; --rec-bg: #FFE9EA; --send-bg: #FFF4E0; --ok: #2E9E5B; --ok-bg: #E6F6EC;
  --idle-bg: #E8F0FF; --badge: #D93036; --ring: #FF8A00; --bubble-out: #DCE8FF; --bubble-in: #F1F3F7;
  font-family: "Nunito", "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); overflow: hidden; user-select: none; -webkit-user-select: none; touch-action: manipulation; }
button { font: inherit; color: inherit; border: none; cursor: pointer; background: none; padding: 0; }
button:focus-visible { outline: 4px solid var(--ink); outline-offset: 4px; }
[hidden] { display: none !important; }

.ekran { position: absolute; inset: 0; display: flex; flex-direction: column; padding: 3.2vh 3.6vw 4vh; gap: 3vh; }
.ust { display: flex; align-items: center; justify-content: space-between; gap: 2vw; min-height: 9vh; }
h1 { margin: 0; font-size: clamp(26px, 6vh, 50px); font-weight: 900; letter-spacing: -.5px; }
.hap { display: flex; align-items: center; gap: 10px; background: #FFF1DE; color: #8A4B00; padding: 1.2vh 1.6vw; border-radius: 999px; font-size: clamp(16px, 3.2vh, 26px); font-weight: 800; }
.hap svg { width: 1.2em; height: 1.2em; }

/* ana ekran */
#ana { padding: 2.2vh 2.2vw; gap: 0; }
#ana.cok { padding-bottom: 5.4vh; }
.izgara { flex: 1; min-height: 0; display: flex; overflow-x: auto; overflow-y: hidden; scroll-snap-type: x mandatory; scrollbar-width: none; overscroll-behavior: contain; }
.izgara::-webkit-scrollbar { display: none; }
.sayfa { flex: 0 0 100%; min-width: 0; scroll-snap-align: start; scroll-snap-stop: always; display: grid; gap: 2vh 1.8vw; padding: .6vh .6vw;
  grid-template-columns: repeat(var(--sutun, 3), minmax(0, 1fr)); grid-template-rows: repeat(var(--satir, 1), minmax(0, 1fr)); }
.noktalar { position: absolute; left: 0; right: 0; bottom: 1.4vh; display: flex; justify-content: center; gap: 1.6vh; pointer-events: none; }
.noktalar i { width: 1.8vh; height: 1.8vh; border-radius: 50%; background: #C9CFDA; transition: transform .2s, background .2s; }
.noktalar i.secili { background: var(--ink); transform: scale(1.25); }
.noktalar i.yeni { background: var(--badge); box-shadow: 0 0 0 .5vh rgba(242, 139, 80, .35); }
.ok { position: absolute; top: 50%; transform: translateY(-50%); width: 10vh; height: 10vh; border-radius: 50%; background: rgba(255, 255, 255, .92); color: var(--ink);
  display: flex; align-items: center; justify-content: center; box-shadow: 0 6px 18px rgba(29, 36, 51, .22); z-index: 3; }
.ok svg { width: 55%; height: 55%; }
.ok.sol { left: .8vw; } .ok.sag { right: .8vw; }
.kutucuk { position: relative; border-radius: 36px; overflow: hidden; display: flex; flex-direction: column; box-shadow: 0 10px 30px rgba(29, 36, 51, .14); background: var(--renk); transition: transform .12s; }
.kutucuk:active { transform: scale(.97); }
.kutucuk .gorsel { flex: 1; min-height: 0; display: flex; align-items: flex-end; justify-content: center; overflow: hidden; position: relative; }
.foto-arka { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; filter: blur(16px) brightness(.8); transform: scale(1.2); }
.foto-on { position: relative; width: 100%; height: 100%; object-fit: contain; }
.kutucuk .gorsel svg { width: 62%; height: 88%; }
.kutucuk .ad { position: absolute; left: 0; right: 0; bottom: 0; padding: 3.4vh 1vw 1.1vh; color: #fff; background: linear-gradient(rgba(0, 0, 0, 0), rgba(0, 0, 0, .55));
  font-size: clamp(15px, 3.6vh, 30px); font-weight: 900; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-shadow: 0 1px 3px rgba(0, 0, 0, .5); pointer-events: none; }
.kutucuk.yeni { animation: parla 1.6s ease-in-out infinite; }
@keyframes parla { 0%, 100% { box-shadow: 0 0 0 6px var(--ring), 0 10px 30px rgba(29, 36, 51, .14); } 50% { box-shadow: 0 0 0 14px rgba(255, 138, 0, .35), 0 10px 30px rgba(29, 36, 51, .14); } }
.rozet { position: absolute; top: 2vh; right: 1.8vw; min-width: 7.5vh; height: 7.5vh; padding: 0 1.6vh; border-radius: 999px; background: var(--badge); color: #fff; font-size: 4vh; font-weight: 900; display: flex; align-items: center; justify-content: center; border: 4px solid #fff; }
.bos { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; color: var(--muted); text-align: center; font-size: clamp(16px, 3vh, 24px); font-weight: 700; }
.bos b { color: var(--ink); font-size: 1.3em; }

/* kişi ekranı */
.geri { width: 11vh; height: 11vh; border-radius: 50%; background: #fff; box-shadow: 0 6px 18px rgba(29, 36, 51, .1); display: flex; align-items: center; justify-content: center; flex: none; }
.geri svg { width: 52%; height: 52%; }
.baslik { display: flex; align-items: center; gap: 2vw; min-width: 0; }
.avatar { width: 11vh; height: 11vh; border-radius: 3vh; background: var(--renk); overflow: hidden; display: flex; align-items: flex-end; justify-content: center; flex: none; border: 4px solid #fff; box-shadow: 0 6px 18px rgba(29, 36, 51, .14); position: relative; }
.avatar svg { width: 82%; height: 82%; }
.govde { flex: 1; min-height: 0; display: flex; gap: 2.4vw; }
.mesajlar { flex: 1; min-width: 0; background: #fff; border-radius: 36px; box-shadow: 0 10px 30px rgba(29, 36, 51, .08); padding: 3vh 2vw; display: flex; flex-direction: column; gap: 2.2vh; overflow-y: auto; scroll-behavior: smooth; }
.mesajlar::-webkit-scrollbar { width: 10px; } .mesajlar::-webkit-scrollbar-thumb { background: #D5DBE5; border-radius: 10px; }
.satir { display: flex; align-items: flex-start; gap: 1.2vw; }
.satir.giden { justify-content: flex-end; }
.kucuk-av { width: 11vh; height: 11vh; border-radius: 3vh; flex: none; overflow: hidden; background: var(--renk); display: flex; align-items: flex-end; justify-content: center; }
.kucuk-av img { width: 100%; height: 100%; object-fit: cover; }
.kucuk-av svg { width: 84%; height: 84%; }
.balon { display: flex; align-items: center; gap: 1.4vw; padding: 1.4vh 2vw 1.4vh 1.4vh; border-radius: 6vh; background: var(--bubble-in); max-width: 86%; position: relative; }
.giden .balon { background: var(--bubble-out); }
.balon.yeni::after { content: ""; position: absolute; top: -4px; right: -4px; width: 22px; height: 22px; border-radius: 50%; background: var(--badge); border: 3px solid #fff; }
.oynat { width: 9vh; height: 9vh; border-radius: 50%; flex: none; background: var(--renk); color: #fff; display: flex; align-items: center; justify-content: center; }
.giden .oynat { background: var(--accent); }
.oynat svg { width: 45%; height: 45%; }
.dalga { display: flex; align-items: center; gap: 4px; height: 6vh; }
.dalga i { display: block; width: 6px; border-radius: 3px; background: #9AA3B5; transform-origin: center; }
.caliyor .dalga i { background: var(--ink); animation: dalga .7s ease-in-out infinite; }
@keyframes dalga { 0%, 100% { transform: scaleY(.3); } 50% { transform: scaleY(1); } }
.sure { font-size: 3vh; font-weight: 800; color: #3B4456; min-width: 3em; font-variant-numeric: tabular-nums; }
.durum-ik { width: 3.6vh; height: 3.6vh; flex: none; }
.durum-ik.hata { color: var(--rec); } .durum-ik.bekle { color: var(--muted); } .durum-ik.tamam { color: var(--ok); }
.dinle { flex: 1; min-width: 0; border-radius: 36px; background: color-mix(in srgb, var(--renk) 16%, #fff); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3vh; padding: 3vh 2vw; transition: opacity .2s; }
.dinle.yeni { animation: parla 1.6s ease-in-out infinite; }
.dinle.yok { opacity: .45; }
.dinle .oynat-b { width: 42vh; height: 42vh; max-width: 100%; aspect-ratio: 1; border-radius: 50%; background: var(--renk); color: #fff; box-shadow: 0 18px 40px rgba(29, 36, 51, .25); display: flex; align-items: center; justify-content: center; }
.dinle .oynat-b svg { width: 42%; height: 42%; }
.dinle .oynat-b:disabled { box-shadow: none; cursor: default; }
.dinle .dalga { height: 8vh; }
.dinle .dalga i { width: 7px; }
.dinle.caliyor .dalga i { background: var(--ink); animation: dalga .7s ease-in-out infinite; }
.kayitta .dinle { opacity: .3; pointer-events: none; }
.bildirim { position: fixed; left: 50%; bottom: 5vh; transform: translateX(-50%); background: var(--ok); color: #fff; border-radius: 999px; padding: 2vh 4vh; font-size: clamp(18px, 4.4vh, 34px); font-weight: 900; display: flex; align-items: center; gap: 2vh; box-shadow: 0 10px 30px rgba(29, 36, 51, .25); z-index: 10; animation: pop .3s ease-out; }
.bildirim.hata { background: var(--rec); }
.bildirim svg { width: 5vh; height: 5vh; }
.panel { flex: 1; min-width: 0; border-radius: 36px; background: var(--idle-bg); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3vh; padding: 3vh 2vw; transition: background .3s; }
.panel.kayit { background: var(--rec-bg); } .panel.gonderiliyor { background: var(--send-bg); } .panel.gitti { background: var(--ok-bg); } .panel.hata { background: var(--rec-bg); }
.mik { width: 42vh; height: 42vh; max-width: 100%; aspect-ratio: 1; border-radius: 50%; background: var(--accent); color: #fff; box-shadow: 0 18px 40px rgba(47, 111, 237, .35); display: flex; align-items: center; justify-content: center; position: relative; }
.mik svg { width: 42%; height: 42%; position: relative; }
.kayit .mik { background: var(--rec); box-shadow: none; }
.kayit .mik::before { content: ""; position: absolute; inset: 0; border-radius: 50%; background: #E5484D; animation: nabiz 1.4s ease-out infinite; }
@keyframes nabiz { 0% { transform: scale(1); opacity: .55; } 100% { transform: scale(1.4); opacity: 0; } }
.etiket { font-size: clamp(18px, 4.4vh, 34px); font-weight: 900; text-align: center; }
.canli { display: flex; align-items: center; gap: 5px; height: 8vh; }
.canli i { display: block; width: 7px; border-radius: 4px; background: var(--rec); height: 10%; transition: height .08s; }
.sayac { font-size: 6vh; font-weight: 900; color: #A8141A; font-variant-numeric: tabular-nums; line-height: 1; }
.cubuk { width: 70%; height: 16px; border-radius: 8px; background: #F5D9A8; overflow: hidden; }
.cubuk i { display: block; height: 100%; background: #E08A00; width: 100%; }
.geri-al { height: 13vh; padding: 0 5vh; border-radius: 7vh; border: 4px solid var(--ink); background: #fff; display: flex; align-items: center; gap: 2vh; font-size: 4.6vh; font-weight: 900; }
.geri-al svg { width: 5vh; height: 5vh; }
.tik { width: 30vh; height: 30vh; border-radius: 50%; background: var(--ok); color: #fff; display: flex; align-items: center; justify-content: center; animation: pop .35s ease-out; }
.tik svg { width: 55%; height: 55%; }
@keyframes pop { 0% { transform: scale(.6); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }

.baglanti { position: absolute; top: 1.4vh; left: 50%; transform: translateX(-50%); background: #fff; color: var(--muted); border-radius: 999px; padding: .6vh 1.4vw; font-size: 2.2vh; font-weight: 800; box-shadow: 0 4px 14px rgba(29, 36, 51, .12); display: flex; align-items: center; gap: 8px; z-index: 5; }
.baglanti svg { width: 2.6vh; height: 2.6vh; }
.uyku { position: fixed; inset: 0; background: #000; z-index: 20; opacity: 0; pointer-events: none; transition: opacity 1.2s; display: flex; align-items: center; justify-content: center; }
.uyku.acik, .uyku.kalkan { opacity: 1; pointer-events: auto; }
.uyku.kalkan:not(.acik) { opacity: 0; }
.saat-kutu { display: flex; flex-direction: column; align-items: center; gap: 1vh; color: #C9D2E3; transition: transform 2s; font-variant-numeric: tabular-nums; }
.saat { font-size: 30vh; font-weight: 800; letter-spacing: -.02em; line-height: 1; }
.tarih { font-size: 5vh; font-weight: 700; color: #7E899C; display: flex; align-items: center; gap: 1.4vh; }
.tarih svg { width: 5vh; height: 5vh; }
.uyku.gece .saat-kutu { color: #6E5A3A; }          /* gece: kısık, sıcak renk */
.uyku.gece .tarih { color: #4A3D29; }
body.gece { --bg: #0F1420; --ink: #E6EAF2; --muted: #98A2B5; --idle-bg: #1A2233; --rec-bg: #3A1A1D; }
body.gece .kutucuk, body.gece .dinle, body.gece .panel, body.gece .geri, body.gece .hap { filter: brightness(.72); }
body.gece .geri { background: #1C2433; color: #E6EAF2; }
body.gece .ok { background: rgba(28, 36, 51, .92); color: #E6EAF2; }
body.gece .hap { background: #2A2416; color: #E9C98A; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<section class="ekran" id="ana">
  <div class="izgara" id="izgara"></div>
  <button class="ok sol" id="okSol" aria-label="Önceki sayfa" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
  <button class="ok sag" id="okSag" aria-label="Sonraki sayfa" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></button>
  <div class="noktalar" id="noktalar" hidden></div>
  <div class="bos" id="bos" hidden><b data-t="bos_baslik">Henüz kimse eklenmedi</b><span><span data-t="bos_alt">Kişileri yönetim sayfasından ekleyin:</span> <span id="yonetimAdres"></span></span></div>
</section>

<section class="ekran" id="kisi" hidden>
  <div class="ust">
    <div class="baslik">
      <button class="geri" id="geri" data-t-aria="geri" aria-label="Kişilere dön"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
      <div class="avatar" id="kAvatar"></div>
      <h1 id="kAd"></h1>
    </div>
  </div>
  <div class="govde">
    <div class="dinle yok" id="dinle">
      <button class="oynat-b" id="oynatB" aria-label="Son mesajı dinle" disabled></button>
      <div class="dalga" id="dalga2"></div>
      <span class="etiket" id="dinleYazi">Henüz mesaj yok</span>
    </div>
    <div class="panel" id="panel">
      <div id="pBos">
        <div style="display:flex;flex-direction:column;align-items:center;gap:3vh">
          <button class="mik" id="mik" data-t-aria="kayit_basla" aria-label="Kaydı başlat"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2.5" width="6" height="12" rx="3" fill="currentColor"/><path d="M5 11a7 7 0 0 0 14 0"/><path d="M12 18v3.5"/></svg></button>
          <span class="etiket" id="mikYazi" data-t="konus">Konuşmak için dokun</span>
        </div>
      </div>
      <div id="pKayit" hidden style="display:flex;flex-direction:column;align-items:center;gap:2.6vh">
        <button class="mik" id="dur" data-t-aria="kayit_bitir" aria-label="Kaydı bitir ve gönder"><svg viewBox="0 0 24 24" fill="currentColor"><rect x="5" y="5" width="14" height="14" rx="3"/></svg></button>
        <div class="canli" id="canli"></div>
        <span class="sayac" id="sayac">0:00</span>
        <span class="etiket" style="color:#7A1E22" data-t="bitirince">Bitirince dokun</span>
      </div>
      <div id="pHata" hidden style="display:flex;flex-direction:column;align-items:center;gap:2vh;text-align:center">
        <span class="etiket" style="color:#7A1E22" id="hataYazi">Olmadı, bir daha dene</span>
      </div>
    </div>
  </div>
</section>

<div class="baglanti" id="baglanti" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M2 2l20 20"/><path d="M8.5 16.5a5 5 0 0 1 7 0"/><path d="M5 12.86a10 10 0 0 1 5.17-2.69"/><path d="M19 12.86a10 10 0 0 0-2.01-1.48"/><path d="M12 20h.01"/></svg><span id="baglantiYazi">İnternet yok, mesajlar sonra gidecek</span></div>
<div class="bildirim" id="bildirim" hidden></div>
<div class="uyku" id="uyku"><div class="saat-kutu" id="saatKutu"><div class="saat" id="saat">--:--</div><div class="tarih" id="tarih"></div></div></div>
<audio id="ses" preload="none"></audio>

<script>
(function () {
"use strict";
const $ = id => document.getElementById(id);
const SILUET = '<svg viewBox="0 0 100 87" aria-hidden="true"><circle cx="50" cy="34" r="22" fill="#fff" fill-opacity=".92"/><path d="M8 87c2-24 19-36 42-36s40 12 42 36z" fill="#fff" fill-opacity=".92"/></svg>';
const IK = {
  oynat: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.5-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z"/></svg>',
  dur: '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="5" y="4" width="5" height="16" rx="1.5"/><rect x="14" y="4" width="5" height="16" rx="1.5"/></svg>',
  saat: '<svg class="durum-ik bekle" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
  hata: '<svg class="durum-ik hata" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7.5v5.5"/><path d="M12 16.5v.01"/></svg>',
  tamam: '<svg class="durum-ik tamam" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
};
let D = { kisiler: [], maks_saniye: 60, uyku_dakika: 2, sessiz: false, gece: false, cevrimici: true, dil: "tr", zil_acik: true, zil_seviye: 80, saat_goster: true };
const METIN = {
  tr: { baslik: "Kime mesaj gönderelim?", bos_baslik: "Henüz kimse eklenmedi", bos_alt: "Kişileri yönetim sayfasından ekleyin:",
        geri: "Kişilere dön", kayit_basla: "Kaydı başlat", kayit_bitir: "Kaydı bitir ve gönder", konus: "Konuşmak için dokun",
        bitirince: "Bitirince dokun", dinle: "Son mesajı dinle", durdur: "Durdur", mesaj_yok: "Henüz mesaj yok",
        dinliyorsun: "Dinliyorsun…", yeni: "Yeni mesaj!", yeniler: "{n} yeni mesaj!", tekrar: "Tekrar dinle",
        yazdi: "{adlar} sana yazdı", ve: " ve ", gonderildi: ad => ek(ad) + " gönderildi", gonderilemedi: "Gönderilemedi, bir daha dene",
        mik_yok: "Mikrofon bulunamadı", kisa: "Çok kısa oldu, bir daha dene", internet: "İnternet yok, mesajlar sonra gidecek",
        anahtar: "Bot anahtarı hatalı", yeni_mesaj: "yeni mesaj",
        gunler: ["Pazar", "Pazartesi", "Salı", "Çarşamba", "Perşembe", "Cuma", "Cumartesi"],
        aylar: ["Ocak", "Şubat", "Mart", "Nisan", "Mayıs", "Haziran", "Temmuz", "Ağustos", "Eylül", "Ekim", "Kasım", "Aralık"],
        tarih: (g, d, a) => `${g}, ${d} ${a}` },
  en: { baslik: "Who do you want to talk to?", bos_baslik: "No one added yet", bos_alt: "Add people from the admin page:",
        geri: "Back to people", kayit_basla: "Start recording", kayit_bitir: "Finish and send", konus: "Tap to talk",
        bitirince: "Tap when done", dinle: "Play last message", durdur: "Stop", mesaj_yok: "No messages yet",
        dinliyorsun: "Listening…", yeni: "New message!", yeniler: "{n} new messages!", tekrar: "Play again",
        yazdi: "{adlar} sent you a message", ve: " and ", gonderildi: ad => "Sent to " + ad, gonderilemedi: "Couldn't send, try again",
        mik_yok: "No microphone found", kisa: "Too short, try again", internet: "No internet, messages will be sent later",
        anahtar: "Bot key is wrong", yeni_mesaj: "new messages",
        gunler: ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"],
        aylar: ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"],
        tarih: (g, d, a) => `${g}, ${a} ${d}` },
};
const t = (k, v = {}) => { const x = (METIN[D.dil] || METIN.tr)[k]; return typeof x === "string" ? x.replace(/\{(\w+)\}/g, (_, a) => v[a]) : x; };
let sonDil = null;
function metinleriUygula() {
  if (D.dil === sonDil) return; sonDil = D.dil; document.documentElement.lang = D.dil;
  document.querySelectorAll("[data-t]").forEach(e => e.textContent = t(e.dataset.t));
  document.querySelectorAll("[data-t-aria]").forEach(e => e.setAttribute("aria-label", t(e.dataset.tAria)));
}
function baglantiGoster() {
  $("baglanti").hidden = D.cevrimici || D.demo;
  $("baglantiYazi").textContent = D.neden === "anahtar" ? t("anahtar") : t("internet");
}
let simdiki = null, mod = "bos", caliyorId = null;
const kisiBul = id => D.kisiler.find(k => k.id === id);
const foto = k => k.foto ? `<img class="foto-arka" src="/medya/${k.foto}" alt=""><img class="foto-on" src="/medya/${k.foto}" alt="">` : SILUET;
const ek = ad => { const s = ad.toLowerCase(); const son = (s.match(/[aeıioöuü]/g) || ["e"]).pop(); const sesli = /[aeıioöuü]$/.test(s);
  const ince = "eiöü".includes(son); return ad + "’" + (sesli ? "y" : "") + (ince ? "e" : "a"); };
const sure = s => { s = Math.max(0, Math.round(s)); return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); };

/* ---------- veri ---------- */
async function durumAl() {
  const r = await fetch("/api/durum"); D = await r.json();
  if (window.ilkSurum && D.surum && D.surum !== window.ilkSurum) { location.reload(); return; }
  window.ilkSurum = window.ilkSurum || D.surum;
  metinleriUygula(); sonListe = ""; if (simdiki) dinleCiz(); saatCiz();
  baglantiGoster();
  if (simdiki && !kisiBul(simdiki)) anaya();
  ciz();
}
async function mesajlariAl() {
  if (!simdiki) return;
  const r = await fetch("/api/mesajlar/" + simdiki); const ms = await r.json();
  listeCiz(ms);
}

/* ---------- ana ekran ---------- */
// En fazla 3x3 = 9 kişi bir sayfada; fazlası sonraki sayfalara (kaydırarak ya da oklarla).
const SAYFA_BOYU = 9;
const duzen = n => n <= 1 ? [1, 1] : n === 2 ? [2, 1] : n === 3 ? [3, 1] : n === 4 ? [2, 2] : n <= 6 ? [3, 2] : [3, 3];
let sonIzgara = "", hedefKisi = null;
const sayfaNo = () => { const iz = $("izgara"); return iz.clientWidth ? Math.round(iz.scrollLeft / iz.clientWidth) : 0; };
function sayfayaGit(i, yumusak) { const iz = $("izgara"); iz.scrollTo({ left: i * iz.clientWidth, behavior: yumusak ? "smooth" : "auto" }); }
function sayfaGostergesi() {
  const iz = $("izgara"), n = iz.children.length, i = sayfaNo();
  $("okSol").hidden = n < 2 || i <= 0; $("okSag").hidden = n < 2 || i >= n - 1;
  [...$("noktalar").children].forEach((d, j) => d.classList.toggle("secili", j === i));
}
function ciz() {
  const iz = $("izgara"); const ks = D.kisiler;
  $("bos").hidden = ks.length > 0; iz.hidden = ks.length === 0;
  $("yonetimAdres").textContent = location.host.replace("localhost", "<cihaz-adresi>") + "/yonetim";
  const sayfalar = []; for (let i = 0; i < ks.length; i += SAYFA_BOYU) sayfalar.push(ks.slice(i, i + SAYFA_BOYU));
  const [sut, sat] = sayfalar.length > 1 ? [3, 3] : duzen(ks.length);
  const imza = JSON.stringify([ks, sut, sat, D.dil]);
  if (imza !== sonIzgara) {
    sonIzgara = imza; const eski = sayfaNo();
    iz.innerHTML = sayfalar.map(sk => `<div class="sayfa" style="--sutun:${sut};--satir:${sat}">` + sk.map(k =>
      `<button class="kutucuk${k.okunmamis ? " yeni" : ""}" data-id="${k.id}" style="--renk:${k.renk}" aria-label="${k.ad}${k.okunmamis ? ", " + k.okunmamis + " " + t("yeni_mesaj") : ""}">
        <div class="gorsel">${foto(k)}</div><span class="ad">${k.ad}</span>${k.okunmamis ? `<span class="rozet">${k.okunmamis}</span>` : ""}</button>`).join("") + "</div>").join("");
    $("noktalar").hidden = sayfalar.length < 2; $("ana").classList.toggle("cok", sayfalar.length > 1);
    $("noktalar").innerHTML = sayfalar.map(sk => `<i class="${sk.some(k => k.okunmamis) ? "yeni" : ""}"></i>`).join("");
    sayfayaGit(Math.min(eski, sayfalar.length - 1));
  }
  if (hedefKisi !== null) {                       // yeni mesaj gelen kişinin sayfasına geç
    const i = ks.findIndex(k => k.id === hedefKisi); hedefKisi = null;
    if (i >= 0 && !simdiki) sayfayaGit(Math.floor(i / SAYFA_BOYU), true);
  }
  sayfaGostergesi();
  document.body.classList.toggle("gece", !!D.gece); $("uyku").classList.toggle("gece", !!D.gece);
  if (simdiki) baslikCiz();
}
$("izgara").addEventListener("scroll", () => requestAnimationFrame(sayfaGostergesi), { passive: true });
$("okSol").addEventListener("click", () => sayfayaGit(sayfaNo() - 1, true));
$("okSag").addEventListener("click", () => sayfayaGit(sayfaNo() + 1, true));
addEventListener("resize", () => sayfayaGit(sayfaNo()));
$("izgara").addEventListener("click", e => { const b = e.target.closest(".kutucuk"); if (b) kisiAc(+b.dataset.id); });

/* ---------- kişi ekranı ---------- */
function baslikCiz() { const k = kisiBul(simdiki); if (!k) return; $("kAd").textContent = k.ad; $("kAvatar").style.setProperty("--renk", k.renk); $("kAvatar").innerHTML = foto(k); }
function kisiAc(id) { simdiki = id; sonGelen = null; sonListe = ""; $("ana").hidden = true; $("kisi").hidden = false; baslikCiz(); panel("bos"); dinleCiz(); mesajlariAl(); }
function anaya() { sesDur(); if (mod === "kayit") kayitIptal(); simdiki = null; $("kisi").hidden = true; $("ana").hidden = false; durumAl(); }
let bildirimT = null;
function bildir(yazi, hata) {
  const b = $("bildirim"); b.className = "bildirim" + (hata ? " hata" : "");
  b.innerHTML = (hata ? "" : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>') + yazi;
  b.hidden = false; clearTimeout(bildirimT); bildirimT = setTimeout(() => b.hidden = true, 2600);
}
$("geri").addEventListener("click", anaya);

function cubuklar(id, n) { let x = (id * 9301 + 49297) % 233280, s = ""; for (let i = 0; i < n; i++) { x = (x * 9301 + 49297) % 233280; s += `<i style="height:${30 + Math.round(x / 233280 * 70)}%;animation-delay:${(i % 7) * .08}s"></i>`; } return s; }
// Kişi ekranında tek "dinle" düğmesi: dinlenmemiş mesaj varsa HEPSİNİ eskiden yeniye sırayla çalar,
// hepsi dinlendiyse yalnızca SON mesajı çalar.
let sonListe = "", sonGelen = null, gelenler = [], kuyruk = [], kuyrukToplam = 0, kuyrukSira = 0;
const dinlenmemis = () => gelenler.filter(m => !m.dinlendi);
function listeCiz(ms) {
  gelenler = ms.filter(m => m.yon === "gelen" && m.dosya);
  const m = gelenler.length ? gelenler[gelenler.length - 1] : null;
  const imza = JSON.stringify(gelenler.map(x => [x.id, x.dinlendi])) + caliyorId; if (imza === sonListe) return; sonListe = imza;
  sonGelen = m; dinleCiz();
}
function dinleCiz() {
  const k = kisiBul(simdiki); if (!k) return;
  const m = sonGelen, cal = caliyorId !== null, yeni = dinlenmemis().length, kart = $("dinle"), b = $("oynatB");
  kart.style.setProperty("--renk", k.renk);
  kart.classList.toggle("yok", !m); kart.classList.toggle("yeni", !!yeni && !cal); kart.classList.toggle("caliyor", cal);
  b.disabled = !m; b.innerHTML = cal ? IK.dur : IK.oynat; b.setAttribute("aria-label", cal ? t("durdur") : t("dinle"));
  $("dalga2").innerHTML = cubuklar(m ? m.id : 7, 18);
  $("dinleYazi").textContent = !m ? t("mesaj_yok")
    : cal ? t("dinliyorsun") + (kuyrukToplam > 1 ? ` ${kuyrukSira}/${kuyrukToplam}` : "")
    : yeni > 1 ? t("yeniler", { n: yeni }) : yeni ? t("yeni") : t("tekrar");
}
function siradaki() {
  const m = kuyruk.shift();
  if (!m) { kuyrukToplam = 0; sesDur(); return; }
  kuyrukSira++; oynat(m.id, m.dosya, true);
}
$("oynatB").addEventListener("click", () => {
  if (caliyorId !== null) { kuyruk = []; kuyrukToplam = 0; sesDur(); return; }
  const yeni = dinlenmemis();
  kuyruk = yeni.length ? yeni.slice() : (sonGelen ? [sonGelen] : []);
  kuyrukToplam = kuyruk.length; kuyrukSira = 0; siradaki();
});

/* ---------- dinleme ---------- */
const ses = $("ses");
function oynat(id, dosya, gelen) {
  ses.src = "/medya/" + dosya; ses.currentTime = 0;
  ses.play().catch(() => {}); caliyorId = id; sonListe = "";
  if (gelen) { const m = gelenler.find(x => x.id === id); if (m && !m.dinlendi) { m.dinlendi = 1; fetch("/api/dinlendi/" + id, { method: "POST" }).then(durumAl); } }
  dinleCiz();
}
function sesDur() { ses.pause(); kuyruk = []; kuyrukToplam = 0; if (caliyorId !== null) { caliyorId = null; sonListe = ""; dinleCiz(); } }
ses.addEventListener("ended", () => { if (kuyruk.length) { caliyorId = null; setTimeout(siradaki, 600); } else sesDur(); });

/* ---------- kayıt ---------- */
let akim = null, kaydedici = null, parcalar = [], kayitBas = 0, sayacT = null, analiz = null, animT = null;
const ctx = window.AudioContext ? new AudioContext() : null;
$("canli").innerHTML = "<i></i>".repeat(24);
function panel(m) {
  mod = m; $("panel").className = "panel " + ({ kayit: "kayit", hata: "hata" }[m] || "");
  $("kisi").classList.toggle("kayitta", m === "kayit");
  $("pBos").hidden = m !== "bos"; $("pKayit").hidden = m !== "kayit"; $("pHata").hidden = m !== "hata";
}
async function mikrofon() {
  if (akim && akim.active) return akim;
  akim = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true, channelCount: 1 } });
  return akim;
}
async function kayitBasla() {
  sesDur();
  try { await mikrofon(); } catch (e) { $("hataYazi").textContent = t("mik_yok"); panel("hata"); setTimeout(() => panel("bos"), 2500); return; }
  if (ctx && ctx.state === "suspended") ctx.resume();
  const tur = ["audio/webm;codecs=opus", "audio/ogg;codecs=opus", "audio/mp4", ""].find(t => !t || (window.MediaRecorder && MediaRecorder.isTypeSupported(t)));
  kaydedici = new MediaRecorder(akim, tur ? { mimeType: tur, audioBitsPerSecond: 64000 } : undefined);
  parcalar = []; kaydedici.ondataavailable = e => { if (e.data.size) parcalar.push(e.data); };
  kaydedici.start(250); kayitBas = performance.now(); panel("kayit"); $("sayac").textContent = "0:00";
  sayacT = setInterval(() => { const s = (performance.now() - kayitBas) / 1000; $("sayac").textContent = sure(s); if (s >= D.maks_saniye) kayitBitir(); }, 250);
  if (ctx) { const kaynak = ctx.createMediaStreamSource(akim); analiz = ctx.createAnalyser(); analiz.fftSize = 512; kaynak.connect(analiz); canliCiz(); }
}
function canliCiz() {
  const ic = $("canli").children, veri = new Uint8Array(analiz.fftSize), gecmis = new Array(24).fill(0.08);
  const adim = () => {
    if (mod !== "kayit") return;
    analiz.getByteTimeDomainData(veri); let t = 0; for (const v of veri) t += (v - 128) * (v - 128);
    gecmis.push(Math.min(1, Math.sqrt(t / veri.length) / 40 + 0.08)); gecmis.shift();
    for (let i = 0; i < 24; i++) ic[i].style.height = (gecmis[i] * 100) + "%";
    animT = requestAnimationFrame(adim);
  }; adim();
}
function kayitDurdur() { clearInterval(sayacT); cancelAnimationFrame(animT); return new Promise(r => { if (!kaydedici || kaydedici.state === "inactive") return r(null); kaydedici.onstop = () => r(new Blob(parcalar, { type: kaydedici.mimeType || "audio/webm" })); kaydedici.stop(); }); }
async function kayitBitir() {
  if (mod !== "kayit") return;
  const sn = (performance.now() - kayitBas) / 1000; const blob = await kayitDurdur();
  if (!blob || sn < 0.8) { $("hataYazi").textContent = t("kisa"); panel("hata"); setTimeout(() => mod === "hata" && panel("bos"), 1800); return; }
  const k = kisiBul(simdiki), kisi = simdiki;
  panel("bos"); anaya();                                   // hemen ana ekrana dön
  bildir(t("gonderildi")(k.ad));
  try {
    const r = await fetch("/api/gonder?kisi=" + kisi, { method: "POST", body: blob, headers: { "Content-Type": blob.type || "application/octet-stream" } });
    if (!r.ok) throw new Error(await r.text());
  } catch (e) { bildir(t("gonderilemedi"), true); }
}
async function kayitIptal() { await kayitDurdur(); panel("bos"); }
$("mik").addEventListener("click", kayitBasla);
$("dur").addEventListener("click", kayitBitir);

/* ---------- canlı güncelleme ---------- */
let sonZil = 0;
function zil(hafif, deneme) {
  if (!ctx || (!deneme && (D.sessiz || !D.zil_acik))) return; if (ctx.state === "suspended") ctx.resume();
  sonZil = Date.now();
  const t = ctx.currentTime + 0.05;
  const cikis = ctx.createGain(); cikis.gain.value = (hafif ? 0.5 : 1) * (D.zil_seviye ?? 80) / 100;
  const sik = ctx.createDynamicsCompressor(); cikis.connect(sik).connect(ctx.destination);
  [[659.25, 0], [880, 0.18], [1318.5, 0.36]].forEach(([f, d]) => {          // Mi - La - Mi (ding-dang-dong)
    [[1, "sine", 1], [2, "sine", 0.25], [3, "triangle", 0.08]].forEach(([k, tip, v]) => {
      const o = ctx.createOscillator(), g = ctx.createGain(); o.type = tip; o.frequency.value = f * k;
      g.gain.setValueAtTime(0, t + d); g.gain.linearRampToValueAtTime(v, t + d + 0.015);
      g.gain.exponentialRampToValueAtTime(0.0005, t + d + 1.1);
      o.connect(g).connect(cikis); o.start(t + d); o.stop(t + d + 1.15);
    });
  });
}
// Dinlenmemiş mesaj varken her HATIRLAT_DAKIKA dakikada bir hafif hatırlatma
setInterval(() => {
  const dk = Number(D.hatirlat_dakika || 0); if (!dk) return;
  const bekleyen = D.kisiler.some(k => k.okunmamis > 0);
  if (bekleyen && Date.now() - sonZil >= dk * 60000) zil(true);
}, 30000);
let ws = null, wsBekle = 1000;
function bagla() {
  ws = new WebSocket((location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/ws");
  ws.onopen = () => { wsBekle = 1000; durumAl(); mesajlariAl(); };
  ws.onmessage = e => {
    const o = JSON.parse(e.data);
    if (o.tur === "mesaj") { if (o.yon === "gelen") { hedefKisi = o.kisi; if (!D.sessiz) { uyandir(); zil(); } } durumAl(); if (o.kisi === simdiki) mesajlariAl(); }
    else if (o.tur === "baglanti") { D.cevrimici = o.cevrimici; D.neden = o.neden || ""; baglantiGoster(); }
    else if (o.tur === "zil_dene") { uyandir(); zil(false, true); }
    else durumAl();
  };
  ws.onclose = () => { setTimeout(bagla, wsBekle); wsBekle = Math.min(15000, wsBekle * 2); };
}

/* ---------- uyku ---------- */
let sonDokunma = Date.now();
function uykuBildir(u) { fetch("/api/ekran", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ uyku: u }) }).catch(() => {}); }
function uyandir() { sonDokunma = Date.now(); if ($("uyku").classList.contains("acik")) { $("uyku").classList.remove("acik"); uykuBildir(false); } }
// Uyurken ilk dokunuş YALNIZCA ekranı açar: o dokunuşa ait hiçbir olay (basma, bırakma, tıklama, kaydırma)
// alttaki kişiye ya da düğmeye ulaşmaz. Parmak kalkana kadar ve sonrasında kısa bir süre olaylar yutulur.
let uyanmaDokunusu = false, yutBitis = 0;
function dokunmaYut(e) {
  if (!uyanmaDokunusu && Date.now() >= yutBitis) return false;
  if (e.cancelable) e.preventDefault();
  e.stopPropagation(); e.stopImmediatePropagation();
  return true;
}
document.addEventListener("pointerdown", e => {
  if ($("uyku").classList.contains("acik")) {
    uyanmaDokunusu = true; $("uyku").classList.add("kalkan");
    uyandir(); dokunmaYut(e); return;
  }
  if (dokunmaYut(e)) return;
  uyandir();
}, true);
function uyanmaBitti(e) {
  if (!uyanmaDokunusu) return dokunmaYut(e);
  dokunmaYut(e); uyanmaDokunusu = false; yutBitis = Date.now() + 350;
  setTimeout(() => $("uyku").classList.remove("kalkan"), 350);
}
document.addEventListener("pointerup", uyanmaBitti, true);
document.addEventListener("pointercancel", uyanmaBitti, true);
["click", "mousedown", "mouseup", "touchstart", "touchmove", "touchend", "contextmenu", "dblclick"]
  .forEach(ev => document.addEventListener(ev, dokunmaYut, { capture: true, passive: false }));
document.addEventListener("keydown", uyandir, true);
setInterval(() => {
  const bos = (Date.now() - sonDokunma) / 60000;
  if (mod === "kayit" || !ses.paused) { sonDokunma = Date.now(); return; }
  if (simdiki && bos > Math.min(2, D.uyku_dakika || 2)) anaya();
  if (bos > (D.uyku_dakika || 2) && !$("uyku").classList.contains("acik")) { $("uyku").classList.add("acik"); uykuBildir(true); }
}, 5000);
/* ---------- saat (24 saat) ---------- */
const AY_IK = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M20.5 14.2A8.5 8.5 0 0 1 9.8 3.5a8.5 8.5 0 1 0 10.7 10.7z"/></svg>';
let sonDakika = -1;
const METIN_TARIH = d => t("tarih")(t("gunler")[d.getDay()], d.getDate(), t("aylar")[d.getMonth()]);
function saatCiz() {
  const sa = new Date(), p = n => String(n).padStart(2, "0");
  $("saat").textContent = p(sa.getHours()) + ":" + p(sa.getMinutes());
  $("saatKutu").hidden = D.saat_goster === false;
  $("tarih").innerHTML = (D.gece ? AY_IK : "") + `<span>${METIN_TARIH(sa)}</span>`;
  if (sa.getMinutes() !== sonDakika) {        // ekranda iz kalmasın diye saat her dakika biraz kayar
    sonDakika = sa.getMinutes();
    $("saatKutu").style.transform = `translate(${Math.round(Math.random() * 8 - 4)}vw, ${Math.round(Math.random() * 8 - 4)}vh)`;
  }
}
saatCiz(); setInterval(saatCiz, 5000);
setInterval(durumAl, 60000);
document.addEventListener("contextmenu", e => e.preventDefault());

durumAl().catch(() => {}); bagla();
})();
</script>
